server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Don't leak nginx version in headers / error pages.
    server_tokens off;

    # Bare host -> the app.
    location = / {
        return 302 /pwsh-lessons/;
    }

    # Bare prefix -> trailing slash, so relative asset paths resolve.
    location = /pwsh-lessons {
        return 308 /pwsh-lessons/;
    }

    # The app. MkDocs uses directory URLs, so "$uri/" serves each page's
    # index.html.
    location /pwsh-lessons/ {
        try_files $uri $uri/ =404;
        error_page 404 /pwsh-lessons/404.html;
    }
}
