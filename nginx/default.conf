server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Don't leak nginx version in headers / error pages.
    server_tokens off;

    # Emit redirects as path-only ("Location: /pwsh-lessons/"), never as a full
    # URL. Behind the GSAP edge the origin's Host header is the internal APL
    # hostname, so an absolute redirect (nginx default) bounces the browser to a
    # hostname external users can't reach. Path-only redirects keep the browser
    # on whatever public host it came in on.
    absolute_redirect off;
    port_in_redirect off;

    # Bare host -> the app (no trailing slash; see the block below).
    location = / {
        return 302 /pwsh-lessons;
    }

    # Bare prefix, served WITHOUT a redirect.
    #
    # MkDocs emits every asset/link as a path relative to a URL that ends in "/".
    # Serving index.html at the slash-less "/pwsh-lessons" would make those paths
    # resolve one level too high (/assets/... instead of /pwsh-lessons/assets/...),
    # so we inject a <base> that pins resolution to "/pwsh-lessons/". Every link
    # on the page is then absolute-from-base, so the first click lands on a normal
    # "/pwsh-lessons/<page>/" URL and the rest of the site behaves as usual.
    location = /pwsh-lessons {
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '<head>' '<head><base href="/pwsh-lessons/">';
        try_files /pwsh-lessons/index.html =404;
    }

    # Material's client JS fetches these relative to document.location (which on
    # the landing page is the slash-less "/pwsh-lessons"), not relative to <base>,
    # so they hit the server root. Map them back into the app or search breaks and
    # instant-navigation loses its URL allowlist. Re-check this list on a Material
    # upgrade — a new root-relative fetch would 404 the same way.
    location = /sitemap.xml              { try_files /pwsh-lessons/sitemap.xml =404; }
    location = /sitemap.xml.gz           { try_files /pwsh-lessons/sitemap.xml.gz =404; }
    location = /search/search_index.json { try_files /pwsh-lessons/search/search_index.json =404; }

    # The app. MkDocs uses directory URLs, so "$uri/" serves each page's
    # index.html.
    location /pwsh-lessons/ {
        try_files $uri $uri/ =404;
        error_page 404 /pwsh-lessons/404.html;
    }
}
